# B4XDaisyUIKit-Skills Evaluation Harness config
#
# All paths are relative to the eval/ folder.

skills:
  # Root of the skill suite to evaluate. By default, the parent folder.
  root: ..

layers:
  structural:
    enabled: true
    # Required sections in every components/<name>.md
    required_sections:
      - "## 1. Overview"
      - "## 2. Verified B4X Syntax & Recipe"
      - "## 3. Native Composition Rules & Gotchas"
      - "## 4. Designer Properties"
    # Top-level files that must exist at the suite root
    required_files:
      - README.md
      - plugin.json
    # Files that must exist inside the b4xdaisyuikit skill
    required_skill_files:
      - SKILL.md
      - references/api-cheat-sheet.md
      - references/component-manifest.md
    # Hard threshold — fail the layer if coverage drops below this
    min_component_coverage: 1.0       # 100% of lib classes must have a file
    max_broken_links_per_file: 0

  negative_knowledge:
    enabled: true
    # File containing the banned patterns. See cases/negative-knowledge/bans.md
    bans_file: cases/negative-knowledge/bans.md
    # Max false-positive rate on the trap prompts
    max_false_positive_rate: 0.0

  component_synthesis:
    enabled: false            # off by default — requires runner
    fixtures_dir: cases/component-synthesis
    sample_size: 20           # number of components to test per run
    # Pluggable runner. The runner receives a prompt + skill markdown and
    # returns the generated code as a string.
    runner:
      type: stub              # stub | claude-cli | anthropic-sdk | custom
      # When type != "stub", provide the necessary fields:
      # claude_cli_path: claude
      # anthropic_api_key_env: ANTHROPIC_API_KEY
      # anthropic_model: claude-sonnet-4-5
    # Rubric used by the LLM judge to score the synthesized code
    rubric:
      - id: correct_class
        weight: 0.20
        description: "Code imports the correct B4XDaisy* class"
      - id: correct_constructor
        weight: 0.20
        description: "Code uses the correct 3-step lifecycle (Init / AddToParent / props)"
      - id: real_methods
        weight: 0.25
        description: "All methods called exist in the component (no inventions)"
      - id: design_props
        weight: 0.10
        description: "Designer properties (Variant, Size, Style) are valid enum values"
      - id: code_runs
        weight: 0.15
        description: "Generated B4X is syntactically valid (parses)"
      - id: follows_recipe
        weight: 0.10
        description: "Matches the canonical recipe in components/<name>.md"
    # Fail threshold on weighted rubric (0.0 - 1.0)
    pass_threshold: 0.75

  e2e_recipes:
    enabled: false            # off by default — requires runner + B4A
    fixtures_dir: cases/e2e-recipes
    # One fixture per chapter (ch01..ch09)
    # Runner: same as layer 3
    runner:
      type: stub
    # Where the B4A build is invoked. Stubbed by default.
    b4a_compile_cmd: ""        # e.g. "C:\\b4a\\b4a.exe build"
    pass_threshold: 0.80

  drift:
    enabled: true
    # Path to the B4XDaisyUIKit source — used to scrape class & method names.
    # If empty, drift is skipped.
    lib_source: ../B4A
    # Tolerance — a component is "stale" if it documents < this fraction of
    # the public methods exposed by the class.
    staleness_threshold: 0.90

reporting:
  # Where to write the markdown report
  output_dir: reports
  # Filename pattern; <timestamp> is replaced
  filename_pattern: "eval-{timestamp}.md"
  # Also write a "latest" symlink/copy for easy linking
  write_latest_copy: true
